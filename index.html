<title>정보보안산업기사 모의고사</title>
<style>
:root{color-scheme:light;--bg:#fff;--ink:#0b0b10;--soft:#4a5068;--cob:#1240e0;--line:#d6dcf0}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0a0d18;--ink:#e6e9f5;--soft:#a3abc6;--cob:#7d97ff;--line:#29324f}}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
header{background:#1240e0;color:#fff;padding:32px max(5vw,16px) 28px}
h1{margin:0;font-size:clamp(28px,6vw,40px);line-height:1.15;letter-spacing:-.02em;text-wrap:balance;word-break:keep-all}
header p{margin:8px 0 0;color:#dfe6ff}
main{max-width:720px;margin:0 auto;padding:12px max(5vw,16px) 32px}
a.r{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:20px 4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;min-height:88px}
a.r:focus-visible{outline:3px solid var(--cob);outline-offset:2px}
.n{font-size:34px;font-weight:700;color:var(--cob);line-height:1}
.t{font-size:18px;font-weight:700}.d{display:block;color:var(--soft);font-size:14px}
.g{color:var(--cob);font-size:22px}
footer{max-width:720px;margin:0 auto;padding:0 max(5vw,16px) 40px;color:var(--soft);font-size:14px}
</style>
</head>
